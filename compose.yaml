# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  pgsql:
    image: postgres:${PGSQL_VERSION:-17-alpine}
    container_name: squelify_pgsql
    hostname: postgres
    restart: unless-stopped
    ports: ['5432:5432']
    volumes: ['pgsql_data:/var/lib/postgresql/data']
    environment:
      POSTGRES_DB: squelify
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: securedb
    command: ['postgres', '-c', 'wal_level=logical']
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pgadmin -d squelify']
      interval: 30s
      timeout: 20s
      retries: 3

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: squelify_pgweb
    restart: unless-stopped
    ports: ['54321:8081']
    environment:
      PGWEB_DATABASE_URL: 'postgresql://pgadmin:securedb@pgsql:5432/squelify?sslmode=disable'
    healthcheck:
      test: ["CMD", "nc", "-vz", "127.0.0.1", "8081"]
      interval: 5s
    depends_on:
      pgsql:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    container_name: squelify_mailpit
    restart: unless-stopped
    volumes: ['mailpit_data:/data']
    ports: ['1025:1025', '8025:8025']
    # @ref: https://github.com/axllent/mailpit/wiki/Runtime-options
    environment:
      TZ: Asia/Jakarta

  # ALLOW_EMPTY_PASSWORD is recommended only for development.
  # For better performance, consider `host` mode instead `port` to avoid docker NAT.
  # Notice: Docker `host` mode is NOT currently supported in Swarm Mode.
  # @ref: https://docs.docker.com/compose/compose-file/compose-file-v3/#network_mode
  valkey:
    image: valkey/valkey:8-alpine
    container_name: squelify_valkey
    hostname: valkey
    restart: unless-stopped
    ports: ['6379:6379']
    # network_mode: "host"
    volumes: ['valkey_data:/data:rw']
    environment:
      ALLOW_EMPTY_PASSWORD: yes
      VALKEY_DISABLE_COMMANDS: FLUSHDB,FLUSHALL
    ulimits:
      memlock: -1
      nofile:
        soft: 262144
        hard: 262144

  # @ref: https://github.com/versity/versitygw/wiki/Quickstart
  # export AWS_ACCESS_KEY_ID=myS3AccessKey
  # export AWS_SECRET_ACCESS_KEY=myS3SecretKey
  # export AWS_ENDPOINT_URL=http://127.0.0.1:7070
  # aws s3 mb s3://devbucket
  # aws s3 cp public/favicon.svg s3://devbucket/images/favicon.svg
  # aws --no-verify-ssl --endpoint-url http://127.0.0.1:7070 s3 ls s3://
  locals3:
    image: ghcr.io/versity/versitygw:latest
    container_name: squelify_s3
    restart: unless-stopped
    hostname: locals3
    ports: ['7070:7070']
    volumes: ['./temp/s3data:/srv:rw']
    command: --port 0.0.0.0:7070 posix /srv
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-myS3AccessKey}
      ROOT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-myS3SecretKey}

  localcdn:
    image: joseluisq/static-web-server:2
    container_name: squelify_cdn
    restart: unless-stopped
    ports: ['7080:80', '7443:443']
    environment:
      SERVER_ROOT: /srv
      SERVER_DIRECTORY_LISTING: true
      SERVER_IGNORE_HIDDEN_FILES: true
    volumes: ['./temp/s3data/devbucket:/srv:ro']

volumes:
  pgsql_data:
    driver: local
  mailpit_data:
    driver: local
  valkey_data:
    driver: local
